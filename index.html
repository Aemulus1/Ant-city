          const kinds=['car','person','lamp','tree','bench','bike','sign','bin','hydrant','flowers'],colors=['--blue','--orange','--red','--green','--purple','--yellow'];
          const widths={car:42,person:16,lamp:14,tree:30,bench:34,bike:36,sign:16,bin:18,hydrant:16,flowers:24},small=['person','sign','bin','hydrant','flowers'];
          const makeObject=(type,x,objectScale)=>({type,x,scale:objectScale,color:colors[Math.floor(Math.random()*colors.length)]});

            const baseObjectScale=.48+.52*depthRatio;

        const leftEdge=topLeft+(left-topLeft)*v,rightEdge=topRight+(right-topRight)*v,currentCell=(rightEdge-leftEdge)/cols;
        for(let cx=0;cx<cols;cx+=moduleCols){
          const span=Math.min(moduleCols,cols-cx),center=leftEdge+(rightEdge-leftEdge)*(cx+span/2)/cols,moduleWidth=currentCell*span;
          let ww=baseWindowW,windowH=baseWindowH;
          if(style==='sash'){ww=Math.min(moduleWidth*.62,baseWindowW*.95);windowH=Math.min(windowPitch*.9,baseWindowH*1.55)}
          else if(style==='paired'){ww=Math.min(moduleWidth*.76,baseWindowW*2.45);windowH=Math.min(windowPitch*.72,baseWindowH*1.16)}
          else if(style==='ribbon'){ww=moduleWidth*.84;windowH=Math.min(windowPitch*.55,baseWindowH*.88)}
          else if(style==='grid'){ww=Math.min(moduleWidth*.72,baseWindowW*1.75);windowH=Math.min(windowPitch*.78,baseWindowH*1.3)}
          else if(style==='square'){ww=Math.min(moduleWidth*.62,baseWindowW*1.28);windowH=Math.min(windowPitch*.62,ww*1.05)}
          else {ww=Math.min(moduleWidth*.62,baseWindowW);}
          const wx=center-ww/2;
          if(wy+windowH<b.baseY-5)drawStyledWindow(wx,wy,ww,windowH,style,frontFill,b.windowSeed,cy,cx,b.depthRatio||0);
        }
      }
      drawFacadeFixtures(b,left,right,top,frontFill);
      drawArchitectureDetails(b,left,right,top,frontFill);
      if(b.doorFace==='front'){
        const doorH=Math.min(38,b.h*.2),doorW=Math.min(18,faceWidth*.23),doorTop=b.baseY-doorH,v=(doorTop-top)/(b.baseY-top),edgeL=topLeft+(left-topLeft)*v,edgeR=topRight+(right-topRight)*v,centerTop=edgeL+(edgeR-edgeL)*.5,centerBottom=(left+right)/2;
        polygon([[centerTop-doorW/2,doorTop],[centerTop+doorW/2,doorTop],[centerBottom+doorW/2,b.baseY],[centerBottom-doorW/2,b.baseY]],night?nightSwatch('--blue',24):token('--muted-foreground'));
        ctx.fillStyle=token('--yellow');ctx.fillRect(centerBottom+doorW*.22,b.baseY-doorH*.48,2,3);
      }
      ctx.restore();
    }
    function drawAnt(x,y){
      ctx.save();ctx.translate(x,y);ctx.lineCap='round';ctx.strokeStyle=token('--yellow');ctx.lineWidth=3;
      for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(i*4,2);ctx.lineTo(i*8,9);ctx.stroke();ctx.beginPath();ctx.moveTo(i*4,2);ctx.lineTo(i*8,-5);ctx.stroke()}
      ctx.fillStyle=token('--yellow');ctx.beginPath();ctx.ellipse(0,0,8,5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=token('--red');ctx.beginPath();ctx.arc(7,-1,3,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=token('--yellow');ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(8,-4);ctx.lineTo(12,-9);ctx.moveTo(6,-4);ctx.lineTo(7,-10);ctx.stroke();ctx.restore();
    }
    function drawGround(){
      if(!rows.length)return;
      const firstY=rows[0].baseY,ground=ctx.createLinearGradient(0,firstY,0,1000);
      if(night){ground.addColorStop(0,'rgb(48 53 57)');ground.addColorStop(1,'rgb(29 33 36)')}
      else{ground.addColorStop(0,'rgb(154 157 158)');ground.addColorStop(1,'rgb(119 123 125)')}
      ctx.fillStyle=ground;ctx.fillRect(0,firstY,1000,1000-firstY);
      ctx.save();ctx.globalAlpha=night?.08:.11;ctx.strokeStyle=night?'rgb(194 202 207)':'rgb(62 66 68)';ctx.lineWidth=1;
      for(let y=firstY+18;y<1000;y+=36){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(1000,y);ctx.stroke()}
      ctx.restore();
    }
    function drawCloud(cloud){
      const cloudPath=()=>{ctx.beginPath();ctx.moveTo(-42,9);ctx.bezierCurveTo(-43,-2,-35,-9,-25,-8);ctx.bezierCurveTo(-20,-25,2,-29,10,-12);ctx.bezierCurveTo(25,-19,39,-9,38,4);ctx.bezierCurveTo(50,5,53,18,43,22);ctx.lineTo(-36,22);ctx.bezierCurveTo(-49,20,-51,12,-42,9);ctx.closePath()};
      ctx.save();ctx.translate(cloud.x,cloud.y);ctx.scale(cloud.scale*cloud.stretch,cloud.scale);ctx.globalAlpha=cloud.opacity;
      const top=night?(cloud.tone==='gray'?'rgb(79 91 101)':'rgb(104 116 126)'):(cloud.tone==='gray'?'rgb(151 162 169)':'rgb(224 230 232)');
      const bottom=night?'rgb(39 49 58)':(cloud.tone==='gray'?'rgb(111 126 136)':'rgb(174 185 191)');
      const body=ctx.createLinearGradient(0,-28,0,24);body.addColorStop(0,top);body.addColorStop(.64,top);body.addColorStop(1,bottom);
      cloudPath();ctx.fillStyle=body;ctx.fill();
      ctx.save();cloudPath();ctx.clip();
      const puffs=[[-25,-2,18,12],[-4,-12,25,17],[20,-4,20,14],[4,8,31,12]];
      for(let i=0;i<puffs.length;i++){
        const [x,y,rx,ry]=puffs[i],variation=.12+noise(cloud.seed,i)*.25;
        const haze=ctx.createRadialGradient(x,y,1,x,y,rx);haze.addColorStop(0,night?'rgba(190,199,205,.42)':'rgba(255,255,255,.72)');haze.addColorStop(1,'rgba(255,255,255,0)');
        ctx.globalAlpha=cloud.opacity*variation;ctx.fillStyle=haze;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();
      }
      ctx.restore();ctx.restore();
    }
    function drawClouds(progress){
      const antX=24+952*progress;
      for(const cloud of skyClouds)if(cloud.x<=antX)drawCloud(cloud);
    }
    function drawMoon(moon){
      ctx.save();ctx.fillStyle=token('--yellow');ctx.beginPath();ctx.arc(moon.x,moon.y,moon.radius,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=nightSwatch('--blue',24);ctx.beginPath();ctx.arc(moon.x+moon.radius*.42,moon.y-moon.radius*.2,moon.radius*.88,0,Math.PI*2);ctx.fill();ctx.restore();
    }
    function drawStars(progress){
      const antX=24+952*progress;ctx.save();ctx.fillStyle=nightSwatch('--yellow',82);
      for(const star of skyStars){if(star.x>antX)continue;ctx.globalAlpha=.56+(star.radius/2.1)*.4;ctx.beginPath();ctx.arc(star.x,star.y,star.radius,0,Math.PI*2);ctx.fill();}
      ctx.restore();
    }
    function drawSun(sun){
      ctx.save();const glow=ctx.createRadialGradient(sun.x,sun.y,sun.radius*.2,sun.x,sun.y,sun.radius*2.8);
      glow.addColorStop(0,'rgba(255,248,215,.92)');glow.addColorStop(.34,'rgba(255,239,190,.48)');glow.addColorStop(1,'rgba(255,239,190,0)');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(sun.x,sun.y,sun.radius*2.8,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgb(245 240 215)';ctx.globalAlpha=.88;ctx.beginPath();ctx.arc(sun.x,sun.y,sun.radius,0,Math.PI*2);ctx.fill();ctx.restore();
    }
    function totalBuildProgress(){
      const total=rows.reduce((sum,line)=>sum+line.segments.length,0);if(!total)return 0;
      let done=0;for(let i=0;i<rows.length;i++){if(i<rowIndex)done+=rows[i].segments.length;else if(i===rowIndex){done+=segmentIndex;const current=rows[i].segments[segmentIndex];if(current)done+=progress/current.w;break}}
      return Math.max(0,Math.min(1,done/total));
    }
    function drawBackgroundAnt(progress){
      if(!running||progress>=1)return;
      const x=24+952*progress,y=280+Math.sin(progress*Math.PI*2)*112;
      ctx.save();ctx.translate(x,y);ctx.scale(.72,.72);drawAnt(0,0);ctx.restore();
    }
    function draw(){
      const skyProgress=totalBuildProgress();
      const sky=ctx.createLinearGradient(0,0,0,720);
      if(night){sky.addColorStop(0,'rgb(12 27 41)');sky.addColorStop(.62,'rgb(28 46 59)');sky.addColorStop(1,'rgb(48 61 68)')}
      else{sky.addColorStop(0,'rgb(100 126 145)');sky.addColorStop(.52,'rgb(148 169 181)');sky.addColorStop(1,'rgb(198 207 211)')}
      ctx.fillStyle=sky;ctx.fillRect(0,0,1000,1000);
      const antX=24+952*skyProgress;
      if(night){if(skyMoon&&skyMoon.x<=antX)drawMoon(skyMoon);drawClouds(skyProgress);drawStars(skyProgress)}
      else {if(skySun&&skySun.x<=antX)drawSun(skySun);drawClouds(skyProgress)}
      drawGround();
      drawBackgroundAnt(skyProgress);
      for(let r=0;r<=rowIndex&&r<rows.length;r++){
        const line=rows[r],limit=r<rowIndex?line.segments.length:segmentIndex;
        const streetObjectY=line.baseY+3;
        const frontObjectY=line.baseY+3;
        for(let i=0;i<limit;i++){
          const s=line.segments[i];
          if(s.kind==='building')drawBuilding(s.building,s.w)
          else if(s.objects)for(const object of s.objects)drawTownObject(object,streetObjectY);
        }
        if(r===rowIndex&&segmentIndex<line.segments.length){
          const s=line.segments[segmentIndex];
          if(s.kind==='building')drawBuilding(s.building,progress,line.reverse)
          else if(s.objects&&progress>s.w*.72)for(const object of s.objects)drawTownObject(object,streetObjectY,(progress-s.w*.72)/(s.w*.28));
        }
        const walkProgress=r<rowIndex?1:r===rowIndex?(segmentIndex+(line.segments[segmentIndex]?progress/line.segments[segmentIndex].w:0))/line.segments.length:0;
        for(const object of line.frontObjects||[])if(object.order<=walkProgress)drawTownObject(object,frontObjectY);
      }
      if(running&&rowIndex<rows.length&&segmentIndex<rows[rowIndex].segments.length){const line=rows[rowIndex],s=line.segments[segmentIndex],x=Math.max(15,Math.min(985,line.reverse?s.x+s.w-progress:s.x+progress)),y=s.kind==='building'?s.building.baseY-s.building.h-18:line.baseY-8;drawAnt(x,y)}
    }
    function setStatus(){if(finished)status.textContent='De stad is opgebouwd; gebouwen en stadsobjecten zijn geplaatst.';else if(running)status.textContent='Diepterij '+(rowIndex+1)+' van '+rows.length+' · de mier bouwt en plaatst objecten';else if(rowIndex===0&&segmentIndex===0&&progress===0)status.textContent='Klaar om achteraan te beginnen.';else status.textContent='Gepauzeerd bij diepterij '+Math.min(rowIndex+1,rows.length)+' van '+rows.length+'.'}
    function stop(done=false){running=false;if(frame!==null)cancelAnimationFrame(frame);frame=null;finished=done;startButton.disabled=false;pauseButton.disabled=true;startButton.textContent=done?'Opnieuw starten':'Start';draw();setStatus()}
    function animate(now){if(!running)return;const dt=Math.min((now-lastTime)/1000,.04);lastTime=now;const segment=rows[rowIndex].segments[segmentIndex];progress+=dt*(35+Number(speed.value)*30);if(progress>=segment.w){progress=0;segmentIndex++;if(segmentIndex>=rows[rowIndex].segments.length){segmentIndex=0;rowIndex++;setStatus()}if(rowIndex>=rows.length){stop(true);return}}draw();frame=requestAnimationFrame(animate)}
    function play(){if(finished)reset();running=true;finished=false;started=true;startButton.disabled=true;pauseButton.disabled=false;lastTime=performance.now();setStatus();frame=requestAnimationFrame(animate)}
    function reset(){if(frame!==null)cancelAnimationFrame(frame);frame=null;running=false;finished=false;started=false;rowIndex=0;segmentIndex=0;progress=0;makeRows();startButton.disabled=false;pauseButton.disabled=true;startButton.textContent='Start';draw();setStatus()}
    depth.addEventListener('input',()=>{document.getElementById('ms-depth-value').textContent=depth.value;reset()});height.addEventListener('input',()=>{document.getElementById('ms-height-value').textContent=height.value+'%';reset()});speed.addEventListener('input',()=>{document.getElementById('ms-speed-value').textContent=speed.value});saturation.addEventListener('input',updateFacadeColors);
    startButton.addEventListener('click',play);pauseButton.addEventListener('click',()=>stop(false));document.getElementById('ms-reset').addEventListener('click',reset);
    dayNightButton.addEventListener('click',()=>{night=!night;dayNightButton.textContent=night?'Dag':'Nacht';dayNightButton.setAttribute('aria-pressed',String(night));draw()});
    reset();
  })();
  </script>
</div>
</main></body></html>
